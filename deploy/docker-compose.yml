services:
  heartbeat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: heartbeat:latest
    container_name: heartbeat
    restart: unless-stopped
    ports:
      - "${HEARTBEAT_PORT:-5100}:5000"
    environment:
      HEARTBEAT_DB: sqlite:////data/heartbeat.db
      TZ: "${TZ:-Asia/Shanghai}"
      PORT: "5000"
      START_SCHEDULER: "${START_SCHEDULER:-1}"
      LOG_DIR: "/app/logs"
      GUNICORN_WORKERS: "1"
      GUNICORN_THREADS: "4"
      GUNICORN_LOG_LEVEL: "${GUNICORN_LOG_LEVEL:-info}"
      GUNICORN_LOG_DIR: "/app/logs"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-1}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-0}"
    volumes:
      # 数据库与日志均落盘到 deploy/export/（容器以 UID 10001 运行，需可写）
      - ./export/data:/data
      - ./export/log:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
