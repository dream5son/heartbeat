<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Heartbeat{% endblock %}</title>
    <style>
      :root {
        --text: #0f172a;
        --text-soft: #334155;
        --muted: #64748b;
        --muted-soft: #94a3b8;
        --line: #e5e9f0;
        --line-strong: #d8dfe9;
        --surface: #ffffff;
        --surface-muted: #f7f9fc;
        --canvas: #f4f6fa;
        --link: #2563eb;
        --link-strong: #1d4ed8;
        --ok: #16a34a;
        --ok-strong: #15803d;
        --ok-soft: #e9f8ef;
        --warn: #d97706;
        --warn-strong: #92400e;
        --warn-soft: #fdf4e3;
        --danger: #dc2626;
        --danger-strong: #b91c1c;
        --danger-soft: #fdecec;
        --neutral: #64748b;
        --neutral-soft: #eef2f7;
        --radius-lg: 16px;
        --radius: 12px;
        --radius-sm: 8px;
        --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
        --shadow-md: 0 18px 40px -32px rgba(15, 23, 42, 0.45);
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
          "Liberation Mono", monospace;
      }

      * { box-sizing: border-box; }

      html { -webkit-text-size-adjust: 100%; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--font-sans);
        font-size: 15px;
        line-height: 1.55;
        background: linear-gradient(180deg, #f8fafc 0%, var(--canvas) 42%, #f1f4f9 100%);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--link);
        text-underline-offset: 3px;
      }

      a:hover { color: var(--link-strong); }

      :focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
        border-radius: 4px;
      }

      ::selection {
        background: rgba(37, 99, 235, 0.18);
      }

      .site-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 30;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.94);
      }

      .site-header-inner,
      .page-content,
      .site-footer-inner {
        width: min(1120px, 100%);
        margin: 0 auto;
        padding-left: 20px;
        padding-right: 20px;
      }

      .site-header-inner {
        min-height: 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .site-brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.98rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--text);
        text-decoration: none;
      }

      .site-brand:hover { color: var(--text); }

      .site-brand-mark {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 9px;
        background: #0f172a;
        color: #7ee2a8;
        box-shadow: 0 4px 10px -6px rgba(15, 23, 42, 0.8);
      }

      .site-brand-sub {
        font-size: 0.72rem;
        font-weight: 600;
        color: var(--muted);
        letter-spacing: 0.08em;
      }

      .site-nav {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .site-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .site-nav a {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 12px;
        border-radius: 999px;
        text-decoration: none;
        color: var(--muted);
        font-weight: 600;
        font-size: 0.85rem;
        transition: background 0.16s ease, color 0.16s ease;
      }

      .site-nav a:hover {
        background: var(--neutral-soft);
        color: var(--text);
      }

      .site-nav a.is-active {
        background: #eef2ff;
        color: var(--link-strong);
      }

      .site-github {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        margin-left: 6px;
        border-radius: 999px;
        color: var(--text-soft);
        text-decoration: none;
        transition: background 0.16s ease, color 0.16s ease;
      }

      .site-github:hover {
        background: var(--neutral-soft);
        color: var(--text);
      }

      .site-github svg { display: block; }

      .page-content {
        flex: 1;
        padding-top: 28px;
        padding-bottom: 64px;
      }

      .page-head {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 20px;
      }

      .page-head h1 {
        margin: 0;
        font-size: 1.5rem;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      .page-subtitle {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 34px 20px;
        color: var(--muted);
        font-size: 0.9rem;
        text-align: center;
      }

      .empty-state strong {
        color: var(--text-soft);
        font-size: 0.95rem;
      }

      .site-footer {
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.7);
      }

      .site-footer-inner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 6px 16px;
        padding-top: 14px;
        padding-bottom: 16px;
        color: var(--muted-soft);
        font-size: 0.78rem;
      }

      @media (max-width: 720px) {
        .site-header-inner,
        .page-content,
        .site-footer-inner {
          padding-left: 16px;
          padding-right: 16px;
        }

        .site-header-inner {
          min-height: 56px;
        }

        .site-brand-sub { display: none; }

        .site-nav { gap: 0; }

        .site-nav a {
          padding: 0 9px;
          font-size: 0.8rem;
        }

        .page-content {
          padding-top: 20px;
          padding-bottom: 48px;
        }

        .page-head h1 { font-size: 1.28rem; }
      }

      @media (max-width: 560px) {
        .site-brand-name { display: none; }

        .site-nav a {
          padding: 0 8px;
          font-size: 0.78rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
    {% block page_styles %}{% endblock %}
  </head>
  <body>
    {% set current_path = request.path if request is defined else '/' %}
    <div class="site-shell">
      <header class="site-header">
        <div class="site-header-inner">
          <a class="site-brand" href="/">
            <span class="site-brand-mark" aria-hidden="true">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12h4l2.5-6 4 12 2.5-6H22"></path>
              </svg>
            </span>
            <span class="site-brand-name">Heartbeat</span>
            <span class="site-brand-sub">MONITOR</span>
          </a>
          <div class="site-actions">
            <nav class="site-nav" aria-label="主导航">
              <a href="/"{% if current_path == '/' or current_path.startswith('/services/') %} class="is-active" aria-current="page"{% endif %}>状态总览</a>
              <a href="/alarm-records"{% if current_path.startswith('/alarm-records') %} class="is-active" aria-current="page"{% endif %}>报警记录</a>
              <a href="/config"{% if current_path.startswith('/config') %} class="is-active" aria-current="page"{% endif %}>管理配置</a>
            </nav>
            <a class="site-github" href="https://github.com/dream5son/heartbeat" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 上 Star Heartbeat" title="GitHub · Star">
              <svg width="19" height="19" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
              </svg>
            </a>
          </div>
        </div>
      </header>
      <main class="page-content">
        {% block content %}{% endblock %}
      </main>
      <footer class="site-footer">
        <div class="site-footer-inner">
          <span>Heartbeat Monitor</span>
          <span>服务健康检测与告警</span>
        </div>
      </footer>
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
