<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Heartbeat{% endblock %}</title>
    <style>
      :root {
        --text: #0f172a;
        --muted: #64748b;
        --line: rgba(148, 163, 184, 0.28);
        --surface: rgba(255, 255, 255, 0.86);
        --link: #2563eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        color: var(--text);
      }

      a {
        color: var(--link);
      }

      .site-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .site-header {
        border-bottom: 1px solid var(--line);
        background: var(--surface);
        backdrop-filter: blur(6px);
      }

      .site-header-inner,
      .page-content,
      .site-footer-inner {
        width: min(1100px, 100%);
        margin: 0 auto;
        padding-left: 16px;
        padding-right: 16px;
      }

      .site-header-inner {
        min-height: 58px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
      }

      .site-brand {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text);
        text-decoration: none;
      }

      .site-nav {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .site-nav a {
        text-decoration: none;
        color: var(--muted);
        font-weight: 600;
        font-size: 0.9rem;
      }

      .site-nav a:hover {
        text-decoration: underline;
      }

      .page-content {
        flex: 1;
        padding-top: 24px;
        padding-bottom: 56px;
      }

      .site-footer {
        border-top: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.6);
      }

      .site-footer-inner {
        padding-top: 10px;
        padding-bottom: 12px;
        color: var(--muted);
        font-size: 0.8rem;
      }
    </style>
    {% block page_styles %}{% endblock %}
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header">
        <div class="site-header-inner">
          <a class="site-brand" href="/">Heartbeat</a>
          <nav class="site-nav" aria-label="主导航">
            <a href="/failure-calendar">失败日历</a>
            <a href="/config">管理配置</a>
          </nav>
        </div>
      </header>
      <main class="page-content">
        {% block content %}{% endblock %}
      </main>
      <footer class="site-footer">
        <div class="site-footer-inner">Heartbeat Monitor</div>
      </footer>
    </div>
    {% block scripts %}{% endblock %}
  </body>
</html>
