{% extends "layout.html" %}

{% block title %}服务状态{% endblock %}

{% block page_styles %}
    <style>
      .page-head {
        margin-bottom: 18px;
      }

      .page-meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
        box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.14);
      }

      .summary-card {
        position: relative;
        padding: 20px 22px;
        border-radius: var(--radius-lg);
        border: 1px solid var(--line);
        background: var(--surface);
        box-shadow: var(--shadow-sm);
        margin-bottom: 20px;
      }

      .summary-card.is-healthy {
        border-color: rgba(22, 163, 74, 0.28);
        background: linear-gradient(180deg, #f2fbf6 0%, #fbfefc 100%);
      }

      .summary-card.is-warning {
        border-color: rgba(217, 119, 6, 0.3);
        background: linear-gradient(180deg, #fefaf0 0%, #fffdf8 100%);
      }

      .summary-card.is-critical {
        border-color: rgba(220, 38, 38, 0.28);
        background: linear-gradient(180deg, #fef4f4 0%, #fffbfb 100%);
      }

      .summary-card.is-neutral {
        background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      }

      .summary-head {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        flex-wrap: wrap;
      }

      .summary-icon {
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        background: var(--ok);
        box-shadow: 0 0 0 5px rgba(22, 163, 74, 0.12);
      }

      .is-warning .summary-icon {
        background: var(--warn);
        box-shadow: 0 0 0 5px rgba(217, 119, 6, 0.12);
      }

      .is-critical .summary-icon {
        background: var(--danger);
        box-shadow: 0 0 0 5px rgba(220, 38, 38, 0.12);
      }

      .is-neutral .summary-icon {
        background: var(--neutral);
        box-shadow: 0 0 0 5px rgba(100, 116, 139, 0.12);
      }

      .summary-copy {
        flex: 1;
        min-width: 200px;
      }

      .summary-title {
        margin: 2px 0 0;
        font-size: 1.16rem;
        line-height: 1.35;
        letter-spacing: -0.01em;
      }

      .summary-subtitle {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.88rem;
      }

      .summary-chip {
        flex: none;
        align-self: center;
        padding: 4px 12px;
        border-radius: 999px;
        border: 1px solid var(--line-strong);
        background: rgba(255, 255, 255, 0.85);
        color: var(--text-soft);
        font-size: 0.76rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .summary-trend {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px dashed var(--line-strong);
      }

      .trend-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }

      .trend-title {
        margin: 0;
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-soft);
      }

      .trend-scale {
        color: var(--muted-soft);
        font-size: 0.74rem;
      }

      .status-panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
      }

      .panel-header {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--line);
        background: #fbfcfe;
      }

      .panel-heading {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }

      .panel-title {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
      }

      .panel-hint {
        color: var(--muted-soft);
        font-size: 0.76rem;
      }

      .range-picker {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
      }

      .range-btn {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: none;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        transition: background 0.16s ease, color 0.16s ease;
      }

      .range-btn:hover:not([disabled]) {
        background: var(--neutral-soft);
        color: var(--text);
      }

      .range-btn[disabled] {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .range-label {
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        line-height: 1.25;
        padding: 0 6px;
      }

      .range-text {
        font-size: 0.78rem;
        font-weight: 600;
        color: var(--text-soft);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      .range-hint {
        font-size: 0.68rem;
        color: var(--muted-soft);
      }

      .status-stack {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
      }

      .service-card {
        min-width: 0;
        padding: 18px 20px 16px;
        border-bottom: 1px solid var(--line);
        transition: background 0.16s ease;
      }

      .service-card:last-child { border-bottom: none; }

      .service-card:hover { background: #fcfdff; }

      .service-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 12px;
      }

      .service-ident {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .service-name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 700;
        font-size: 0.98rem;
        color: var(--text);
        text-decoration: none;
      }

      .service-name:hover {
        color: var(--link-strong);
        text-decoration: underline;
      }

      .icon-link {
        flex: none;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        color: var(--muted-soft);
        background: transparent;
        border: 1px solid transparent;
        text-decoration: none;
        transition: background 0.16s ease, color 0.16s ease, border-color 0.16s ease;
      }

      .icon-link:hover {
        background: #eef2ff;
        border-color: #dbe3ff;
        color: var(--link);
      }

      .status-badge {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        white-space: nowrap;
        border: 1px solid transparent;
      }

      .status-badge::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }

      .status-badge.healthy {
        color: var(--ok-strong);
        background: var(--ok-soft);
        border-color: rgba(22, 163, 74, 0.2);
      }

      .status-badge.unhealthy {
        color: var(--danger-strong);
        background: var(--danger-soft);
        border-color: rgba(220, 38, 38, 0.2);
      }

      .status-badge.partial {
        color: var(--warn-strong);
        background: var(--warn-soft);
        border-color: rgba(217, 119, 6, 0.24);
      }

      .status-badge.unknown {
        color: #475569;
        background: var(--neutral-soft);
        border-color: rgba(100, 116, 139, 0.2);
      }

      .service-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 14px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
      }

      .service-meta .meta-item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-width: 0;
      }

      .service-meta .meta-item.is-failure {
        color: var(--danger-strong);
      }

      .meta-divider {
        width: 1px;
        height: 11px;
        background: var(--line-strong);
      }

      .timeline {
        margin-top: 12px;
        width: 100%;
        max-width: 100%;
        min-height: 18px;
        display: block;
        position: relative;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .timeline::-webkit-scrollbar {
        display: none;
        width: 0;
        height: 0;
      }

      .timeline svg {
        display: block;
      }

      .timeline rect {
        transition: opacity 0.16s ease;
      }

      .timeline rect:hover {
        opacity: 0.72;
      }

      .timeline-tooltip {
        position: fixed;
        pointer-events: none;
        z-index: 40;
        background: rgba(15, 23, 42, 0.94);
        color: #f8fafc;
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 0.74rem;
        line-height: 1.45;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.28);
        max-width: 320px;
        opacity: 0;
        transform: translateY(4px);
        transition: opacity 0.12s ease, transform 0.12s ease;
      }

      .timeline-tooltip.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .children-block {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px dashed var(--line-strong);
      }

      .children-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
        color: var(--muted);
        font-size: 0.74rem;
        font-weight: 600;
        letter-spacing: 0.04em;
      }

      .children-count {
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--neutral-soft);
        color: var(--text-soft);
        font-size: 0.7rem;
        letter-spacing: 0;
      }

      .child-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 8px;
        border-radius: 10px;
        transition: background 0.16s ease;
      }

      .child-row:hover { background: #f8fafc; }

      .child-row .status-badge { margin-left: auto; }

      .dot {
        flex: none;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        display: inline-block;
      }

      .dot.healthy { background: var(--ok); }
      .dot.unhealthy { background: var(--danger); }
      .dot.partial { background: var(--warn); }
      .dot.unknown { background: var(--muted-soft); }

      .child-name {
        flex: none;
        max-width: 46%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-soft);
        text-decoration: none;
      }

      .child-name:hover {
        color: var(--link-strong);
        text-decoration: underline;
      }

      .child-hint {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font-size: 0.76rem;
        font-variant-numeric: tabular-nums;
      }

      .panel-legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 12px 20px 14px;
        border-top: 1px solid var(--line);
        background: #fbfcfe;
        color: var(--muted);
        font-size: 0.74rem;
      }

      .legend-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .legend-swatch {
        width: 10px;
        height: 10px;
        border-radius: 3px;
      }

      .legend-swatch.healthy { background: #22c55e; }
      .legend-swatch.unhealthy { background: #ef4444; }
      .legend-swatch.unknown { background: #cbd5e1; }

      .legend-note {
        margin-left: auto;
        color: var(--muted-soft);
      }

      .empty-state {
        padding: 40px 20px;
        gap: 8px;
      }

      .empty-state svg {
        color: var(--muted-soft);
        margin-bottom: 2px;
      }

      @media (max-width: 720px) {
        .summary-card {
          padding: 16px;
        }

        .summary-icon {
          width: 32px;
          height: 32px;
        }

        .summary-chip {
          order: 3;
          margin-left: 46px;
        }

        .panel-header {
          padding: 14px 16px;
        }

        .panel-hint { display: none; }

        .range-label { padding: 0 2px; }

        .range-hint { display: none; }

        .service-card {
          padding: 16px;
        }

        .child-name {
          max-width: 52%;
        }

        .meta-divider { display: none; }

        .child-hint { display: none; }

        .panel-legend {
          padding: 12px 16px;
        }

        .legend-note { display: none; }
      }
    </style>
{% endblock %}

{% block content %}
    <div class="page-head">
      <div>
        <h1>服务状态</h1>
        <p class="page-subtitle">每分钟自动检测，状态异常时通过邮件通知。</p>
      </div>
      <p class="page-meta">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="meta">正在加载状态…</span>
      </p>
    </div>

    <div id="summary" class="summary-card is-neutral" aria-live="polite"></div>

    <section class="status-panel">
      <div class="panel-header">
        <div class="panel-heading">
          <h2 class="panel-title">服务明细</h2>
          <span class="panel-hint">按天汇总历史检测结果</span>
        </div>
        <div class="range-picker" role="group" aria-label="时间范围">
          <button id="range-prev-btn" class="range-btn" type="button" aria-label="上一时间段">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <span class="range-label">
            <span id="range-text" class="range-text">近 128 天</span>
            <span class="range-hint">按天</span>
          </span>
          <button id="range-next-btn" class="range-btn" type="button" aria-label="下一时间段">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </div>
      <div id="roots" class="status-stack"></div>
      <div class="panel-legend">
        <span class="legend-item"><i class="legend-swatch healthy"></i>正常</span>
        <span class="legend-item"><i class="legend-swatch unhealthy"></i>异常</span>
        <span class="legend-item"><i class="legend-swatch unknown"></i>无数据</span>
        <span class="legend-note">悬停色块可查看当天检测详情</span>
      </div>
    </section>
{% endblock %}

{% block scripts %}
    <script>
      const rootsEl = document.getElementById('roots');
      const metaEl = document.getElementById('meta');
      const summaryEl = document.getElementById('summary');
      const rangeTextEl = document.getElementById('range-text');
      const rangePrevBtnEl = document.getElementById('range-prev-btn');
      const rangeNextBtnEl = document.getElementById('range-next-btn');

      const RANGE_WINDOW_DAYS = 128;
      const DAY_MS = 24 * 60 * 60 * 1000;

      const STATUS_META = {
        healthy: { label: '健康', className: 'healthy' },
        unhealthy: { label: '异常', className: 'unhealthy' },
        partial: { label: '部分异常', className: 'partial' },
        unknown: { label: '未知', className: 'unknown' }
      };

      function statusClass(status) {
        return STATUS_META[status]?.className || 'unknown';
      }

      function statusText(status) {
        return STATUS_META[status]?.label || '未知';
      }

      function resolveNodeState(node) {
        const children = Array.isArray(node?.children) ? node.children : [];
        if (!children.length) {
          return node?.status || 'unknown';
        }

        const childStates = children.map((child) => child?.status || 'unknown');
        if (childStates.every((state) => state === 'healthy')) {
          return 'healthy';
        }
        if (childStates.every((state) => state === 'unknown')) {
          return 'unknown';
        }
        if (childStates.some((state) => state === 'unhealthy') && childStates.some((state) => state === 'healthy')) {
          return 'partial';
        }
        if (childStates.some((state) => state === 'unhealthy')) {
          return 'unhealthy';
        }
        return 'unknown';
      }

      function statusDot(status) {
        return `<span class="dot ${statusClass(status)}"></span>`;
      }

      function formatStamp(value, short = false) {
        if (!value) return '';
        const normalized = String(value).replace('T', ' ');
        return short ? normalized.slice(5, 19) : normalized.slice(0, 19);
      }

      function failureHintText(hint) {
        if (!hint) return '暂无失败记录';
        return `最近失败：${formatStamp(hint.check_time)} · ${hint.summary}`;
      }

      function failureMetaHtml(hint) {
        if (!hint) {
          return '<span class="meta-item">近期无失败</span>';
        }
        return `
          <span class="meta-item is-failure" title="${escapeHtml(failureHintText(hint))}">
            ${statusDot('unhealthy')}
            最近失败 ${formatStamp(hint.check_time, true)}
          </span>
        `;
      }

      function normalizeDate(date) {
        return new Date(date.getFullYear(), date.getMonth(), date.getDate());
      }

      function addDays(date, offset) {
        const next = new Date(date);
        next.setDate(next.getDate() + offset);
        return normalizeDate(next);
      }

      function formatDate(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }

      function dayDiff(start, end) {
        return Math.floor((normalizeDate(end).getTime() - normalizeDate(start).getTime()) / DAY_MS);
      }

      function getToday() {
        return normalizeDate(new Date());
      }

      let rangeEndDate = getToday();
      let rangeStartDate = addDays(rangeEndDate, -(RANGE_WINDOW_DAYS - 1));

      function updateRangeButtons() {
        if (!rangePrevBtnEl || !rangeNextBtnEl) return;
        rangePrevBtnEl.disabled = false;
        rangeNextBtnEl.disabled = rangeEndDate.getTime() >= getToday().getTime();
      }

      function refreshRangeText() {
        if (!rangeTextEl) return;
        rangeTextEl.textContent = `${formatDate(rangeStartDate)} – ${formatDate(rangeEndDate)}`;
        updateRangeButtons();
      }

      function shiftRangeByWindow(step) {
        const offset = RANGE_WINDOW_DAYS * step;
        if (step > 0) {
          const maxForwardDays = dayDiff(rangeEndDate, getToday());
          if (maxForwardDays <= 0) {
            return false;
          }
          const forwardDays = Math.min(offset, maxForwardDays);
          rangeStartDate = addDays(rangeStartDate, forwardDays);
          rangeEndDate = addDays(rangeEndDate, forwardDays);
          return true;
        }

        rangeStartDate = addDays(rangeStartDate, offset);
        rangeEndDate = addDays(rangeEndDate, offset);
        return true;
      }

      function initRangePicker() {
        if (!rangePrevBtnEl || !rangeNextBtnEl) return;

        rangePrevBtnEl.addEventListener('click', () => {
          if (!shiftRangeByWindow(-1)) return;
          refreshRangeText();
          void loadStatus();
        });

        rangeNextBtnEl.addEventListener('click', () => {
          if (!shiftRangeByWindow(1)) return;
          refreshRangeText();
          void loadStatus();
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#39;');
      }

      function renderTimeline(statuses, options) {
        const palette = {
          healthy: '#22c55e',
          unhealthy: '#ef4444',
          partial: '#fbbf24',
          unknown: '#cbd5e1'
        };
        const cells = Array.isArray(statuses) ? statuses : [];
        const displayCells = cells.length ? cells : Array(options.defaultCount).fill('unknown');
        const width = displayCells.length * options.cellWidth + Math.max(0, displayCells.length - 1) * options.gap;

        const rects = displayCells.map((item, index) => {
          const status = typeof item === 'string' ? item : item.status;
          const color = palette[status] || palette.unknown;
          const x = index * (options.cellWidth + options.gap);
          const attrs = options.tooltipText ? (() => {
            const text = options.tooltipText(item, index);
            return text ? ` data-tooltip="${escapeHtml(text)}"` : '';
          })() : '';
          return `<rect x="${x}" y="0" width="${options.cellWidth}" height="${options.height}" rx="2" fill="${color}" opacity="${status === 'healthy' ? 0.92 : 1}"${attrs}></rect>`;
        }).join('');

        return `
          <svg class="${options.className}" width="${width}" height="${options.height}" viewBox="0 0 ${width} ${options.height}" aria-label="${options.ariaLabel}">
            ${rects}
          </svg>
        `;
      }

      function dailyTooltipText(item) {
        if (!item || !item.date) return '';
        if (item.status === 'healthy') {
          return `${item.date}：系统状态正常`;
        }
        if (item.status === 'unknown') {
          return `${item.date}：暂无检测数据`;
        }

        const healthyCount = Number(item.healthy_count || 0);
        const unhealthyCount = Number(item.unhealthy_count || 0);
        const unknownCount = Number(item.unknown_count || 0);

        if (unhealthyCount > 0 && healthyCount === 0 && unknownCount === 0) {
          return `${item.date}：所有时段不可用`;
        }
        if (unhealthyCount > 0) {
          const times = Array.isArray(item.failure_times) ? item.failure_times.slice(0, 12) : [];
          const suffix = Array.isArray(item.failure_times) && item.failure_times.length > 12 ? '…' : '';
          const text = times.length ? `${times.map((t) => `${t}失败`).join('，')}${suffix}` : '部分时段失败';
          return `${item.date}：${text}`;
        }
        return `${item.date}：系统状态正常`;
      }

      function renderDailyTimeline(days) {
        return renderTimeline(days, {
          className: 'daily-timeline',
          ariaLabel: `${formatDate(rangeStartDate)} 至 ${formatDate(rangeEndDate)} 按天趋势`,
          defaultCount: RANGE_WINDOW_DAYS,
          cellWidth: 6,
          gap: 2,
          height: 20,
          tooltipText: dailyTooltipText
        });
      }

      function renderRecentHoursTimeline(statuses) {
        return renderTimeline(statuses, {
          className: 'recent-hours-timeline',
          ariaLabel: '最近3小时趋势',
          defaultCount: 180,
          cellWidth: 4,
          gap: 2,
          height: 12
        });
      }

      function renderServiceSummary(node) {
        const service = node.service || {};
        const calendarLink = `/services/${service.id}/service-status-calendar`;
        const status = resolveNodeState(node);
        return `
          <div class="service-top">
            <div class="service-ident">
              <a class="service-name" href="${calendarLink}" title="查看 ${escapeHtml(service.name || '未命名服务')} 的服务状态日历">${escapeHtml(service.name || '未命名服务')}</a>
              <a class="icon-link" href="${calendarLink}" title="查看服务状态日历" aria-label="查看 ${escapeHtml(service.name || '未命名服务')} 的服务状态日历">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="18" rx="2"></rect>
                  <line x1="16" y1="2" x2="16" y2="6"></line>
                  <line x1="8" y1="2" x2="8" y2="6"></line>
                  <line x1="3" y1="10" x2="21" y2="10"></line>
                </svg>
              </a>
            </div>
            <span class="status-badge ${statusClass(status)}">${statusText(status)}</span>
          </div>
          <p class="service-meta">
            <span class="meta-item">最近检测 ${node.last_check_time ? formatStamp(node.last_check_time) : '暂无'}</span>
            <span class="meta-divider" aria-hidden="true"></span>
            ${failureMetaHtml(node.failure_hint)}
          </p>
          <div class="timeline">${renderDailyTimeline(node._daily || [])}</div>
        `;
      }

      function renderChildRow(child) {
        const service = child.service || {};
        const status = child.status || 'unknown';
        const calendarLink = `/services/${service.id}/service-status-calendar`;
        const hint = child.failure_hint ? failureHintText(child.failure_hint) : '暂无失败记录';
        const hintLabel = child.failure_hint ? `最近失败 ${formatStamp(child.failure_hint.check_time, true)}` : '暂无失败记录';
        return `
          <div class="child-row">
            ${statusDot(status)}
            <a class="child-name" href="${calendarLink}" title="查看服务状态日历">${escapeHtml(service.name || '未命名服务')}</a>
            <span class="child-hint" title="${escapeHtml(hint)}">${escapeHtml(hintLabel)}</span>
            <span class="status-badge ${statusClass(status)}">${statusText(status)}</span>
          </div>
        `;
      }

      function renderRootCard(root) {
        const children = root.children || [];
        const childrenHtml = children.length
          ? `
            <div class="children-block">
              <div class="children-head">子服务<span class="children-count">${children.length}</span></div>
              ${children.map(renderChildRow).join('')}
            </div>
          `
          : '';
        return `
          <article class="service-card">
            ${renderServiceSummary(root)}
            ${childrenHtml}
          </article>
        `;
      }

      function mergeStatuses(statuses) {
        if (!statuses.length) return 'unknown';
        if (statuses.every((status) => status === 'healthy')) return 'healthy';
        if (statuses.every((status) => status === 'unknown')) return 'unknown';
        if (statuses.some((status) => status === 'unhealthy') && statuses.some((status) => status === 'healthy')) {
          return 'partial';
        }
        if (statuses.some((status) => status === 'unhealthy')) return 'unhealthy';
        return 'unknown';
      }

      function buildSummaryRecentHours(roots) {
        const series = roots.map((root) => Array.isArray(root._recentHours) ? root._recentHours : []);
        if (!series.length) return Array(180).fill('unknown');

        const maxLength = Math.max(...series.map((item) => item.length), 0);
        if (!maxLength) return Array(180).fill('unknown');

        const merged = [];
        for (let index = 0; index < maxLength; index += 1) {
          const stepStates = series.map((item) => item[index] || 'unknown');
          merged.push(mergeStatuses(stepStates));
        }
        return merged;
      }

      function renderSummary(roots) {
        const states = roots.map((item) => resolveNodeState(item));
        const allHealthy = states.length > 0 && states.every((state) => state === 'healthy');
        const hasPartial = states.some((state) => state === 'partial');
        const hasUnhealthy = states.some((state) => state === 'unhealthy');
        const hasUnknown = states.some((state) => state === 'unknown');

        let title = '一切运行正常';
        let detail = '所有系统均按预期运行，暂无需要处理的事项。';
        let icon = '✓';
        let tone = 'healthy';

        if (!roots.length) {
          title = '暂无监控数据';
          detail = '请先到 “管理配置” 中新增根服务与子服务。';
          icon = '!';
          tone = 'neutral';
        } else if (hasPartial) {
          title = '部分服务异常';
          detail = '部分服务正常，部分子服务当前存在异常。';
          icon = '!';
          tone = 'warning';
        } else if (hasUnhealthy) {
          title = '存在异常服务';
          detail = '请关注异常服务并尽快排查。';
          icon = '!';
          tone = 'critical';
        } else if (hasUnknown) {
          title = '部分服务待确认';
          detail = '部分系统状态尚未确认，请稍后再试。';
          icon = '?';
          tone = 'neutral';
        } else if (!allHealthy) {
          title = '暂无监控数据';
          detail = '当前没有可用的服务状态数据。';
          icon = '!';
          tone = 'neutral';
        }

        const childCount = roots.reduce((total, root) => total + ((root.children || []).length), 0);
        const recentHours = buildSummaryRecentHours(roots);
        const countChip = roots.length
          ? `${roots.length} 个服务${childCount ? ` · ${childCount} 个子服务` : ''}`
          : '等待配置';

        summaryEl.className = `summary-card is-${tone}`;
        summaryEl.innerHTML = `
          <div class="summary-head">
            <span class="summary-icon" aria-hidden="true">${icon}</span>
            <div class="summary-copy">
              <h2 class="summary-title">${title}</h2>
              <p class="summary-subtitle">${detail}</p>
            </div>
            <span class="summary-chip">${countChip}</span>
          </div>
          <div class="summary-trend">
            <div class="trend-head">
              <p class="trend-title">最近 3 小时状态</p>
              <span class="trend-scale">3 小时前 → 现在</span>
            </div>
            <div class="timeline">${renderRecentHoursTimeline(recentHours)}</div>
          </div>
        `;
      }

      function renderRoots(roots) {
        rootsEl.innerHTML = '';
        if (!roots.length) {
          rootsEl.innerHTML = `
            <div class="empty-state">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12h4l2.5-6 4 12 2.5-6h5"></path>
              </svg>
              <strong>还没有配置任何服务</strong>
              <span>请先到 “管理配置” 中新增根服务与子服务。</span>
            </div>
          `;
          return;
        }
        rootsEl.innerHTML = roots.map(renderRootCard).join('');
      }

      function scrollTimelinesToLatest() {
        window.requestAnimationFrame(() => {
          document.querySelectorAll('.timeline').forEach((timeline) => {
            if (!(timeline instanceof HTMLElement)) return;
            timeline.scrollLeft = timeline.scrollWidth;
          });
        });
      }

      async function fetchRecentHours(serviceId, hours = 3) {
        const res = await fetch(`/api/services/${serviceId}/status/recent-hours?hours=${hours}`);
        if (!res.ok) {
          return Array(hours * 60).fill('unknown');
        }
        const data = await res.json();
        const statuses = Array.isArray(data.status) ? data.status : [];
        return statuses.length ? statuses : Array(hours * 60).fill('unknown');
      }

      async function fetchRecentDailyDetail(serviceId, startDate, endDate) {
        const query = new URLSearchParams({
          start_date: formatDate(startDate),
          end_date: formatDate(endDate),
        });
        const res = await fetch(`/api/services/${serviceId}/status/recent-daily-detail?${query.toString()}`);
        if (!res.ok) {
          return [];
        }
        const data = await res.json();
        return Array.isArray(data.days) ? data.days : [];
      }

      let tooltipEl = null;

      function ensureTooltip() {
        if (tooltipEl) return tooltipEl;
        tooltipEl = document.createElement('div');
        tooltipEl.className = 'timeline-tooltip';
        document.body.appendChild(tooltipEl);
        return tooltipEl;
      }

      function hideTooltip() {
        const tip = ensureTooltip();
        tip.classList.remove('visible');
      }

      function showTooltip(content, x, y) {
        const tip = ensureTooltip();
        tip.textContent = content;
        tip.style.left = `${x + 12}px`;
        tip.style.top = `${y + 12}px`;
        tip.classList.add('visible');
      }

      function bindTimelineTooltip() {
        document.addEventListener('pointermove', (event) => {
          const target = event.target instanceof Element ? event.target.closest('rect[data-tooltip]') : null;
          if (!target) {
            hideTooltip();
            return;
          }
          const tooltip = target.getAttribute('data-tooltip');
          if (!tooltip) {
            hideTooltip();
            return;
          }
          showTooltip(tooltip, event.clientX, event.clientY);
        });

        document.addEventListener('pointerout', (event) => {
          if (!(event.relatedTarget instanceof Element)) {
            hideTooltip();
          }
        });
      }

      async function loadStatus() {
        const res = await fetch('/api/status-tree');
        if (!res.ok) {
          metaEl.textContent = '状态加载失败';
          summaryEl.className = 'summary-card is-critical';
          summaryEl.innerHTML = `
            <div class="summary-head">
              <span class="summary-icon" aria-hidden="true">!</span>
              <div class="summary-copy">
                <h2 class="summary-title">状态加载失败</h2>
                <p class="summary-subtitle">请刷新页面或检查后端状态。</p>
              </div>
            </div>
          `;
          return;
        }

        const data = await res.json();
        const roots = data.roots || [];
        metaEl.textContent = `最近刷新 ${formatStamp(data.generated_at) || '未知'} · 每 20 秒自动更新`;

        const enrichedRoots = await Promise.all(
          roots.map(async (root) => {
            const [rootDaily, rootRecentHours] = await Promise.all([
              fetchRecentDailyDetail(root.service.id, rangeStartDate, rangeEndDate),
              fetchRecentHours(root.service.id, 3),
            ]);
            const children = await Promise.all(
              (root.children || []).map(async (child) => {
                const childRecentHours = await fetchRecentHours(child.service.id, 3);
                return { ...child, _recentHours: childRecentHours };
              })
            );
            return { ...root, _daily: rootDaily, _recentHours: rootRecentHours, children };
          })
        );

        renderSummary(enrichedRoots);
        renderRoots(enrichedRoots);
        scrollTimelinesToLatest();
      }

      loadStatus();
      refreshRangeText();
      initRangePicker();
      bindTimelineTooltip();
      setInterval(() => {
        if (document.hidden) return;
        void loadStatus();
      }, 20000);
    </script>
{% endblock %}
